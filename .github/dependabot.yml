# Экшены в workflow закреплены по SHA, а зависимости сайта - точными версиями: без Dependabot они не обновятся.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: "Сайт"
